# Production: статическая сборка фронтенда, без hot-reload.
# Без SSL (пока домен не готов): cp .env.prod .env && NGINX_SSL=off docker compose -f docker-compose.prod.yml up -d --build
# С SSL: ./nginx/scripts/ssl-setup.sh (после настройки DNS), затем NGINX_SSL=on в .env

name: club-card-website-pinanta

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_INTERNAL_PORT}/${POSTGRES_DB}?sslmode=disable
      - PORT=${BACKEND_INTERNAL_PORT}
      - ADMIN_LOGIN=${BACKEND_ADMIN_LOGIN}
      - ADMIN_PASSWORD=${BACKEND_ADMIN_PASSWORD}
      - YANDEX_API_BASE=${YANDEX_API_BASE}
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN}
      - YANDEX_TABLE_PATH=${YANDEX_TABLE_PATH}
    volumes:
      - ./frontend/src/assets:/frontend-assets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${BACKEND_INTERNAL_PORT}/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  db:
    image: postgres:17-alpine
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_INTERNAL_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - NGINX_ENV=prod
      - NGINX_SSL=${NGINX_SSL:-off}
      - DOMAIN=${DOMAIN}
      - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT}
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
