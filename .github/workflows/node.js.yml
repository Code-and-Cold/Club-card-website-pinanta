# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "develop", "feat/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x] # Vue require: ^22.18.0 || >=24.12.0

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: frontend

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
      working-directory: frontend

    - name: Run linter
      run: npm run lint
      working-directory: frontend

    - name: Check formatting
      run: npm run format:check
      working-directory: frontend

    - name: Build project
      run: npm run build --if-present
      working-directory: frontend

    - name: System testing # TODO: Paralelize tessting and other ci activities
      run: npm run test:system
      working-directory: frontend

#    - run: npm test # No tests yet
# There is no deploy to gh-pages, cause it's probably better to do in dedicated workflow
